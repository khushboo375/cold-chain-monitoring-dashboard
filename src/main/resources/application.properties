spring.application.name=cold-chain-dashboard
server.port=${APP_PORT:8089}

# File-backed H2 database: records persist across normal application restarts.
spring.datasource.url=jdbc:h2:file:./data/coldchain;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Local development console only. Do not expose the H2 console publicly.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.tracking-modes=cookie